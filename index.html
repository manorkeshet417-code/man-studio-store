<style>
@font-face{font-family:'Rubik';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/rubik-hebrew-0.woff2) format('woff2');unicode-range:U+0307-0308, U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F}
@font-face{font-family:'Rubik';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/rubik-latin-ext-1.woff2) format('woff2');unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF}
@font-face{font-family:'Rubik';font-style:normal;font-weight:400 800;font-display:swap;src:url(fonts/rubik-latin-2.woff2) format('woff2');unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD}
:root{
  --top:#171a21; --bg:#1b2838; --bg2:#16202d; --panel:#213246; --panel2:#2a475e; --line:#2f4a63;
  --fg:#e6edf3; --mut:#8f98a0; --dim:#8593a1; --acc:#66c0f4; --acc2:#1a9fff;
  --buy1:#75b022; --buy2:#588a1b; --pos:#66c0f4; --mix:#b9a074; --neg:#c35c2c; --bad:#e2534b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 50% -120px,#2a475e 0%,transparent 70%)}
[hidden]{display:none!important}
a{color:var(--acc);text-decoration:none}a:hover{color:#fff}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}

/* header */
header{background:var(--top);position:sticky;top:0;z-index:30;box-shadow:0 2px 12px #0008}
header .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:20px;letter-spacing:.04em;white-space:nowrap}
.logo i{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--acc),#9b5cff);display:grid;place-items:center;font-style:normal;font-size:16px}
nav.main{display:flex;gap:4px}
nav.main a{color:#dcdedf;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:13px;padding:8px 10px;border-radius:4px}
nav.main a:hover{color:#fff}nav.main a.on{color:var(--acc);box-shadow:inset 0 -2px 0 var(--acc)}
.hr{margin-inline-start:auto;display:flex;align-items:center;gap:10px}
.gear{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;color:#c6d4df;font-size:20px;line-height:1}
.gear:hover,.gear.on{background:var(--panel);color:#fff}
.set{max-width:640px;display:grid;gap:18px}
.set h3{margin:0 0 4px;color:#fff;font-size:16px;font-weight:600}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.langs button{display:flex;align-items:center;gap:10px;background:#0e1620;border:2px solid transparent;border-radius:4px;padding:12px 14px;text-align:start;color:#c6d4df}
.langs button:hover{border-color:#ffffff33}
.langs button.on{border-color:var(--acc);color:#fff}
.langs .lb{width:38px;height:38px;border-radius:4px;display:grid;place-items:center;background:var(--panel2);color:#fff;font-weight:700;flex:none}
.langs button.on .lb{background:var(--acc);color:#0e1620}
.langs b{font-size:15px}.langs small{display:block;color:var(--mut)}
.userbtn{display:flex;align-items:center;gap:8px;background:var(--panel);border:0;border-radius:4px;padding:5px 10px 5px 6px;color:#fff;font-weight:600;position:relative}
.av{width:28px;height:28px;border-radius:4px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;background:#3d4450;border-radius:4px;min-width:180px;padding:6px 0;box-shadow:0 8px 24px #000a;z-index:40}
.menu a,.menu button{display:block;width:100%;text-align:start;padding:8px 14px;background:none;border:0;color:#dcdedf;font-size:13px}
.menu a:hover,.menu button:hover{background:#dcdedf;color:#171a21}
.burger{display:none;background:none;border:0;color:#fff;font-size:22px}

/* store sub-nav */
.subnav{display:flex;gap:6px;align-items:center;background:linear-gradient(90deg,#3e6788cc,#3a6182aa);border-radius:4px;padding:6px;margin:18px 0 22px;box-shadow:0 0 10px #0004}
.subnav>a,.ddb{color:#fff;padding:7px 12px;border-radius:3px;font-size:13px;background:none;border:0;white-space:nowrap}
.subnav>a:hover,.ddb:hover,.dd.open .ddb{background:#ffffff1f;color:#fff}
.subnav>a.on,.dd.on .ddb{background:#ffffff2e;box-shadow:inset 0 -2px 0 var(--acc)}
.dd{position:relative}.car{font-size:10px;opacity:.8;display:inline-block;transition:transform .15s}.dd.open .car{transform:rotate(180deg)}
.ddm{display:none;position:absolute;top:100%;inset-inline-start:0;z-index:35;background:#171a21;border:1px solid #2f4a63;border-radius:6px;
  box-shadow:0 12px 32px #000c;padding:10px;gap:6px;min-width:250px}
.ddm.wide{min-width:720px}
.dd.open .ddm{display:flex}
@media (hover:hover){.dd:hover .ddm{display:flex}.dd:hover .car{transform:rotate(180deg)}}
.ddcol{display:flex;flex-direction:column;gap:2px;min-width:220px}.ddcol h5{margin:4px 8px 6px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.ddi{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:4px;color:#dcdedf}
.ddi:hover{background:#2a475e;color:#fff}.ddi .ic{font-size:18px;width:24px;text-align:center}
.ddi b{display:block;font-weight:500;font-size:13.5px}.ddi small{display:block;color:var(--mut);font-size:11.5px;line-height:1.3}
.genrecol .gl{display:grid;grid-template-columns:1fr 1fr;gap:2px}.genrecol .gl a{color:#c6d4df;padding:5px 10px;border-radius:3px;font-size:13px}
.genrecol .gl a:hover{background:#2a475e;color:#fff}
.subnav a:hover{background:#ffffff1f}
.search{margin-inline-start:auto;display:flex;background:#316282;border-radius:3px;overflow:hidden;border:1px solid #0e1c25}
.search input{background:transparent;border:0;padding:6px 10px;width:220px;color:#fff;outline:none}
.search input::placeholder{color:#9fbad0}
.search button{background:var(--acc);border:0;width:34px;color:#0e1c25;font-weight:800}

/* common */
h2.sec{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#fff;margin:30px 0 10px;display:flex;align-items:center;gap:12px}
h2.sec a{margin-inline-start:auto;font-size:12px;border:1px solid #ffffff44;border-radius:3px;padding:2px 10px;color:#fff;text-transform:none;letter-spacing:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:3px;padding:9px 16px;font-weight:600;font-size:14px;color:#fff;background:linear-gradient(90deg,#47bfff,#1a44c2);text-decoration:none}
.btn:hover{filter:brightness(1.15);color:#fff}
.btn.green{background:linear-gradient(90deg,var(--buy1),var(--buy2));color:#d2efa9}
.btn.green:hover{color:#fff}
.btn.ghost{background:#ffffff1a;color:#cfe6f5}
.btn.red{background:#7a2f2a}
.btn.sm{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.tag{display:inline-block;background:#384959;color:var(--acc);font-size:12px;padding:2px 8px;border-radius:2px;margin:0 0 4px 4px}
.mut{color:var(--mut)}.dim{color:var(--dim)}
.panel{background:#0000004d;border-radius:4px;padding:16px}
.empty{text-align:center;color:var(--mut);padding:50px 16px}
.empty b{display:block;font-size:18px;color:#fff;margin-bottom:6px}
.err{color:#ff8a80;font-size:13px;min-height:1.2em}
.spinner{width:36px;height:36px;border:3px solid #ffffff22;border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:70px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.cover{position:relative;aspect-ratio:460/215;background:#0e1620;overflow:hidden;display:block}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.gen{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:10px;font-weight:800;color:#fff;text-shadow:0 2px 10px #0009;letter-spacing:.03em;line-height:1.1}
.hero .side h3,.hero .side .mut,.card .t,.row .t,.gtitle,.gside .desc,.about,.rev .txt,.gen,.prof h1{unicode-bidi:plaintext}
.rv{font-size:12px}.rv.pos{color:var(--pos)}.rv.mix{color:var(--mix)}.rv.neg{color:var(--neg)}

/* hero carousel */
.hero{display:grid;grid-template-columns:1.6fr 1fr;background:#0e1620;box-shadow:0 0 12px #000a;border-radius:3px;overflow:hidden;cursor:pointer;color:inherit}
.hero:hover{color:inherit}
.hero .cover{aspect-ratio:auto;min-height:330px}
.hero .side{padding:18px;background:linear-gradient(135deg,#0c1925,#1c3042);display:flex;flex-direction:column;gap:8px}
.hero .side h3{margin:0;font-size:24px;color:#fff;line-height:1.2}
.hero .shots{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.hero .shots img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:2px;opacity:.85}
.hero .foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.free{background:#4c6b22;color:#beee11;font-weight:700;padding:4px 10px;border-radius:2px;font-size:13px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots button{width:16px;height:9px;border-radius:2px;border:0;background:#ffffff33;padding:0}
.dots button.on{background:#ffffffcc}

/* cards & rows */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#0e1620;border-radius:3px;overflow:hidden;color:inherit;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #000b;color:inherit}
.card .b{padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.card .t{color:#fff;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .f{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.tabsb{display:flex;gap:2px;margin-bottom:0}
.tabsb button{background:#ffffff0d;border:0;color:#8ba4b8;padding:9px 16px;font-size:13px;border-radius:3px 3px 0 0}
.tabsb button.on{background:#ffffff2a;color:#fff}
.rows{background:#ffffff14;padding:8px;border-radius:0 3px 3px 3px;display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:184px 1fr auto;gap:14px;align-items:center;background:#0000004d;padding:6px;border-radius:2px;color:inherit}
.row:hover{background:#ffffff1a;color:inherit}
.row .cover{width:184px;border-radius:2px}
.row .t{color:#fff;font-size:16px}
.row .meta{text-align:end}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.genres a{height:78px;border-radius:4px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:15px;letter-spacing:.04em;text-transform:uppercase;text-shadow:0 2px 6px #0008;transition:filter .15s}
.genres a:hover{filter:brightness(1.25)}
.cta{margin:34px 0 10px;display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#2a475e,#3a2a5e);padding:22px;border-radius:4px}
.cta h3{margin:0 0 4px;color:#fff;font-size:20px}
.cta .btn{margin-inline-start:auto;white-space:nowrap}

/* browse */
.bwrap{display:grid;grid-template-columns:1fr 230px;gap:18px}
.filters{display:flex;flex-direction:column;gap:12px}
.filters .panel h4{margin:0 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.filters a{display:block;color:#c6d4df;padding:3px 0}
.filters a.on{color:var(--acc);font-weight:600}
select,.inp{background:#0e1620;border:1px solid #000;border-radius:3px;padding:8px 10px;color:#fff;width:100%}
textarea.inp{min-height:90px;resize:vertical}

/* game page */
.crumbs{color:var(--mut);font-size:12px;margin:18px 0 4px}
.crumbs a{color:var(--mut)}.crumbs a:hover{color:#fff}
.gtitle{font-size:28px;color:#fff;margin:0 0 12px;font-weight:600;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.gtop{display:grid;grid-template-columns:1fr 324px;gap:14px;background:#0000004d;padding:14px;border-radius:4px}
.media .main{aspect-ratio:16/9;background:#000;display:grid;place-items:center;overflow:hidden}
.media .main img,.media .main iframe{width:100%;height:100%;object-fit:contain;border:0;display:block}
.fillcov{width:100%;height:100%}.fillcov .cover{height:100%;aspect-ratio:auto}.fillcov .gen{font-size:40px!important}
.thumbs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:4px}
.thumbs button{flex:none;width:116px;aspect-ratio:16/9;border:2px solid transparent;padding:0;background:#000;opacity:.6;position:relative}
.thumbs button.on{border-color:#fff;opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .yt{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:#fff;text-shadow:0 0 6px #000}
.gside{display:flex;flex-direction:column;gap:10px;font-size:13px}
.gside .desc{color:#c6d4df;font-size:13.5px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 8px;font-size:12px}
.kv span:nth-child(odd){color:var(--dim);text-transform:uppercase}
.gbody{display:grid;grid-template-columns:1fr 324px;gap:18px;margin-top:18px}
.buybox{background:linear-gradient(-60deg,#e3eaef1a 5%,#5c84b61a 95%);border-radius:4px;padding:16px 18px 30px;position:relative;margin-bottom:22px}
.buybox h3{margin:0 0 4px;color:#fff;font-size:20px;font-weight:500}
.buybox .act{position:absolute;inset-inline-end:16px;bottom:-16px;display:flex;align-items:stretch;background:#000;padding:2px;border-radius:3px}
.buybox .act .price{padding:0 12px;display:grid;place-items:center;color:#beee11;font-size:13px;background:#000}
.about{color:#acb2b8;font-size:14px;line-height:1.65;white-space:pre-wrap;word-wrap:break-word}
.hd{font-size:14px;text-transform:uppercase;color:#fff;letter-spacing:.04em;border-bottom:1px solid;border-image:linear-gradient(to right,#3b6e8c 0%,#3b6e8c00 100%) 1;padding-bottom:4px;margin:26px 0 12px}
[dir=rtl] .hd{border-image:linear-gradient(to left,#3b6e8c 0%,#3b6e8c00 100%) 1}
.rbox{display:flex;flex-direction:column;gap:10px}
.rev{display:grid;grid-template-columns:180px 1fr;gap:0;background:#00000033;border-radius:3px;overflow:hidden}
.rev .who{padding:10px;display:flex;gap:8px;align-items:flex-start;background:#00000033}
.rev .who a{color:#c1dbf4;font-weight:600;word-break:break-all}
.rev .body{padding:10px 14px}
.rev .verdict{display:flex;align-items:center;gap:10px;background:#0000004d;margin:-10px -14px 8px;padding:8px 14px;color:#d6d7d8;font-size:16px}
.rev .ic{width:36px;height:36px;display:grid;place-items:center;border-radius:3px;font-size:20px}
.rev .ic.up{background:#1c4f6f}.rev .ic.dn{background:#5b2525}
.rev .txt{white-space:pre-wrap;word-wrap:break-word;color:#acb2b8}
.write{background:linear-gradient(135deg,#97c0e31a,#4f78a01a);padding:16px;border-radius:4px}
.write h4{margin:0 0 8px;color:#fff;font-size:16px;font-weight:500}
.rec{display:flex;gap:8px;margin:10px 0}
.rec button{background:#212c3d;color:#67c1f5;border:0;border-radius:2px;padding:8px 14px}
.rec button.on{background:#67c1f5;color:#fff}
.summary{display:flex;gap:20px;flex-wrap:wrap;align-items:center;background:#0000004d;padding:12px 14px;border-radius:3px}
.bar{height:8px;width:180px;background:#a34c25;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}

/* forms */
.form{display:grid;gap:16px;max-width:760px}
.form label{display:grid;gap:5px;font-size:13px;color:#c6d4df}
.form .hint{font-size:12px;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.seg{display:flex;gap:6px}
.seg label{display:flex;gap:6px;align-items:center;background:#0e1620;padding:8px 12px;border-radius:3px;cursor:pointer}
.prevs{display:flex;gap:6px;flex-wrap:wrap}
.prevs div{position:relative}
.prevs img{height:70px;border-radius:2px;display:block}
.prevs button{position:absolute;top:2px;inset-inline-end:2px;background:#000c;border:0;border-radius:2px;color:#fff;width:20px;height:20px;padding:0;line-height:1}
.auth{max-width:420px;margin:40px auto}
.auth .tabsb button{flex:1}
.auth .panel{border-radius:0 0 4px 4px;display:grid;gap:14px}

/* library / dash */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{color:var(--mut);font-weight:500;text-align:start;padding:8px;border-bottom:1px solid var(--line)}
.table td{padding:8px;border-bottom:1px solid #ffffff0d;vertical-align:middle}
.table td .cover{width:120px;border-radius:2px}
.pill{font-size:11px;padding:2px 8px;border-radius:9px;background:#2c4a2a;color:#a4d007}
.pill.off{background:#4a2a2a;color:#ff9b8f}
.pill.wait{background:#4a3f1f;color:#ffcf5a}
.soon{background:#4a3f1f;color:#ffcf5a;font-weight:700;padding:4px 10px;border-radius:2px;font-size:12px;white-space:nowrap}
.soonbuy{background:linear-gradient(-60deg,#ffcf5a14 5%,#5c84b61a 95%)}
.soonbox{background:#ffcf5a0d;border:1px dashed #ffcf5a55;border-radius:4px;padding:12px}
/* coins, sales, badges */
.coinpill{display:flex;align-items:center;gap:4px;background:#3b4a1d;color:#d2efa9;border-radius:14px;padding:4px 10px;font-size:13px;white-space:nowrap}
.coinpill:hover{color:#fff;background:#4c6b22}
.dot{position:absolute;top:0;inset-inline-end:-2px;background:var(--bad);color:#fff;border-radius:8px;font-size:10px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px;font-style:normal}
.ptag{background:#000;color:#fff;padding:4px 10px;border-radius:2px;font-size:13px;white-space:nowrap}
.saletag{display:inline-flex;align-items:stretch;border-radius:2px;overflow:hidden;font-size:12px;white-space:nowrap}
.saletag i{background:#4c6b22;color:#beee11;font-style:normal;font-weight:800;padding:4px 7px;font-size:14px;display:grid;place-items:center}
.saletag span{background:#344654;padding:2px 8px;display:flex;flex-direction:column;line-height:1.15;justify-content:center}
.saletag s{color:#738895;font-size:11px}.saletag b{color:#beee11;font-weight:500}
.price.disc{background:#4c6b22!important;color:#beee11!important;font-weight:800;font-size:16px!important}
.salebar{background:#4c6b2233;color:#beee11;border-radius:3px;padding:6px 10px;margin-top:8px;font-size:13px}
.promo{display:inline-block;background:linear-gradient(90deg,#ff9f1a,#ff5a6e);color:#fff;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:2px;vertical-align:middle}

/* gold Game of the Year spotlight */
@keyframes goldshine{to{background-position:-200% 0}}
@keyframes twinkle{0%,100%{opacity:.15;transform:translateY(0) scale(.8)}50%{opacity:1;transform:translateY(-6px) scale(1.2)}}
@keyframes glowpulse{0%,100%{box-shadow:0 0 22px #d4af3766,inset 0 0 0 2px #ffd76a}50%{box-shadow:0 0 46px #ffd76acc,inset 0 0 0 2px #fff3c4}}
.spots{display:grid;gap:12px;margin:16px 0 4px}
.goldspot{position:relative;display:block;border-radius:10px;overflow:hidden;color:#fff;min-height:220px;animation:glowpulse 3s ease-in-out infinite;isolation:isolate}
.goldspot:hover{color:#fff;filter:brightness(1.06)}
.gsbg{position:absolute;inset:0;background:#2a1f00 center/cover;filter:blur(18px) brightness(.45) saturate(1.3);transform:scale(1.15);z-index:-2}
.gsglow{position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,#3b2a0099 0%,#d4af3733 35%,#ffe28a55 50%,#d4af3733 65%,#3b2a0099 100%);background-size:250% 100%;animation:goldshine 6s linear infinite}
.gsstars{position:absolute;inset:0;pointer-events:none;z-index:0}.gsstars i{position:absolute;font-style:normal;color:#ffe28a;text-shadow:0 0 8px #ffd76a;
  left:calc(var(--i) * 7% + 2%);top:calc(10% + (var(--i) * 37 % 70) * 1%);font-size:calc(10px + var(--i) % 4 * 4px);animation:twinkle calc(2s + var(--i) % 5 * .4s) ease-in-out infinite;animation-delay:calc(var(--i) * -.3s)}
.gsin{position:relative;z-index:1;display:grid;grid-template-columns:minmax(200px,380px) 1fr;gap:22px;align-items:center;padding:22px}
.gsin .cover{border-radius:8px;box-shadow:0 10px 30px #000a;outline:2px solid #ffd76a}
.gscrown{font-size:34px;line-height:1;filter:drop-shadow(0 0 10px #ffd76a)}
.gslabel{display:inline-block;margin:6px 0;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#2a1f00;background:linear-gradient(90deg,#ffe28a,#d4af37,#fff3c4,#d4af37);background-size:200% 100%;animation:goldshine 3s linear infinite;border-radius:4px;padding:3px 10px}
.gstitle{font-size:clamp(24px,4vw,40px);font-weight:800;line-height:1.1;background:linear-gradient(90deg,#fff3c4,#ffd76a,#fff,#ffd76a,#fff3c4);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:goldshine 4s linear infinite;unicode-bidi:plaintext}
.gsdev{color:#ffe9a8;margin-top:4px}.gscats{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.gscats span{background:#000a;border:1px solid #ffd76a88;color:#ffe28a;border-radius:12px;padding:2px 10px;font-size:12px;font-weight:600}
@media (max-width:700px){.gsin{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.goldspot,.gsglow,.gsstars i,.gslabel,.gstitle,.gotywin{animation:none}}

async function deleteGame(g,after){
  if(!await confirmBox(t("delgame")))return;
  const pr=await sb.rpc("get_play",{p_game:g.id});const playUrl=(pr.data||[])[0]?.play_url;
  const{error}=await sb.from("games").delete().eq("id",g.id);if(error)return dbErr(error);
  // best-effort cleanup of uploaded files
  const paths=[g.cover_url,playUrl,...(g.screenshots||[])].map(storagePath).filter(Boolean);
  if(paths.length)sb.storage.from("media").remove(paths).catch(()=>{});
  toast(t("deleted"));after&&after();
}

  const [{data:g},pr]=await Promise.all([sb.from("games").select("id,title,price,coming_soon,owner,file_size").eq("id",id).maybeSingle(),sb.rpc("get_play",{p_game:id})]);
  if(!g)return;
  if(pr.error){toast(errMsg(pr.error));location.replace("#/app/"+id);return}
  const p=(pr.data||[])[0]||{};
  if(g.coming_soon||!p.play_url){toast("🕒 "+t("soon"));location.replace("#/app/"+g.id);return}
  if(me){ // add free game to library + mark played
    if(!myLib.has(g.id)){const{error}=await sb.from("library").insert({user_id:me.id,game_id:g.id});if(!error){myLib.add(g.id);coinBonusCheck();checkProgress()}}
    sb.from("library").update({last_played:nowISO()}).eq("user_id",me.id).eq("game_id",g.id).then(()=>{});
  }
  if(p.play_kind==="link"){const u=okUrl(p.play_url);if(u)window.open(u,"_blank","noopener");location.replace("#/app/"+g.id);return}
  if(p.play_kind==="download"){const sp=storagePath(p.play_url);
    const u=sp?sb.storage.from("media").getPublicUrl(sp,{download:p.file_name||true}).data.publicUrl:okUrl(p.play_url);
    if(u){const a=document.createElement("a");a.href=u;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();
      const mine=me&&g.owner===me.id,inLib=me&&myLib.has(g.id);
      const dm=modal("⬇ "+t("dlStarted"),`<div style="display:grid;gap:10px">
        <div><b style="color:#fff;font-size:16px">${esc(g.title)}</b><div class="dim" style="font-size:12px" dir="ltr">${esc(p.file_name||"")}${g.file_size?" · "+fmtSize(g.file_size):""}</div></div>
        ${inLib?`<div class="status ok" style="padding:8px 12px">✓ ${t("dlInLib")}</div>`:""}
        ${mine?`<div class="status wait" style="padding:8px 12px">🛠️ ${t("dlOwnGame")}</div>`:""}${me?`<div class="mut" style="font-size:13px">🧾 ${t("dlReceipt")} <a href="#/receipts">${t("rcT")}</a></div>`:""}
        <div class="mut" style="font-size:13px"><b style="color:#fff">${t("dlHowT")}</b><br>1. ${t("dlHow1")}<br>2. ${t("dlHow2")}<br>3. ${t("smartscreen")}</div>
        <div class="dim" style="font-size:12px">${t("dlNoStart")} <a href="${esc(u)}" rel="noopener" download>${t("dlAgain")}</a></div>
        <div class="acts"><a class="btn ghost" href="#/library" data-x>📚 ${t("library")}</a><button class="btn green" data-x>${t("gotIt")}</button></div></div>`);}
    location.replace("#/app/"+g.id);return}
  playerEl=document.createElement("div");playerEl.className="player";playerGame=g.id;
  playerEl.innerHTML=`<div class="bar2"><b>${esc(g.title)}</b><span class="dim" id="ptime" style="font-size:12px"></span><button class="btn ghost sm" id="fsBtn">⛶ ${t("fullscreen")}</button><button class="btn sm" id="pcBtn">✕ ${t("close")}</button></div><div id="pbody" style="flex:1;display:flex">${loading()}</div>`;
  document.body.appendChild(playerEl);
  $("#pcBtn").onclick=()=>closePlayer();
  try{
    const res=await fetch(okUrl(p.play_url));if(!res.ok)throw new Error(res.status);
    const html=await res.text();if(playerGame!==g.id)return;
    const fr=document.createElement("iframe");
    // no allow-same-origin: the game can't touch the store, your login or other games
    fr.setAttribute("sandbox","allow-scripts allow-pointer-lock allow-modals allow-forms allow-popups allow-downloads");
    fr.setAttribute("allow","fullscreen; gamepad; autoplay");fr.allowFullscreen=true;fr.title=g.title;
    fr.srcdoc=saveShim(g.id)+html;
    $("#pbody").innerHTML="";$("#pbody").appendChild(fr);fr.focus();
    $("#fsBtn").onclick=()=>(fr.requestFullscreen?fr.requestFullscreen():playerEl.requestFullscreen()).catch(()=>{});
    // playtime: one minute at a time, only while the game is open and visible (unlocks verified reviews)
    if(me&&myLib.has(g.id)){let mins=0;beatTimer=setInterval(async()=>{if(!playerEl||document.visibilityState!=="visible")return;
      const{data}=await sb.rpc("play_beat",{p_game:g.id});if(typeof data==="number"){mins=data;const el=$("#ptime");if(el)el.textContent="⏱ "+t("minPlayed").replace("{n}",mins)}},60000)}
  }catch(e){$("#pbody").innerHTML=`<div class="empty" style="margin:auto"><b>${t("loadfail")}</b></div>`}
}
// sandboxed games have no localStorage; give them one that is saved by the store, per game
function saveShim(id){
  let saved="{}";try{saved=localStorage.getItem("pp_save_"+id)||"{}"}catch(e){}
  return `<script>(function(){var ok=false;try{window.localStorage.getItem("x");ok=true}catch(e){}if(ok)return;
var d=${JSON.stringify(saved).replace(/</g,"\\u003c")};try{d=JSON.parse(d)}catch(e){d={}}
function push(){parent.postMessage({pp:"save",data:JSON.stringify(d)},"*")}
var s={getItem:function(k){k=String(k);return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[String(k)]=String(v);push()},
removeItem:function(k){delete d[String(k)];push()},clear:function(){d={};push()},key:function(i){return Object.keys(d)[i]||null}};
Object.defineProperty(s,"length",{get:function(){return Object.keys(d).length}});
var mem={};var ss={getItem:function(k){return k in mem?mem[k]:null},setItem:function(k,v){mem[k]=String(v)},removeItem:function(k){delete mem[k]},clear:function(){mem={}},key:function(i){return Object.keys(mem)[i]||null}};
try{Object.defineProperty(window,"localStorage",{value:s,configurable:true})}catch(e){}
try{Object.defineProperty(window,"sessionStorage",{value:ss,configurable:true})}catch(e){}})();<\/script>`;
}
window.addEventListener("message",e=>{
  if(!playerEl||!e.data||e.data.pp!=="save")return;
  const fr=playerEl.querySelector("iframe");if(!fr||e.source!==fr.contentWindow)return;
  const s=String(e.data.data||"");if(s.length>2e6)return;
  try{localStorage.setItem("pp_save_"+playerGame,s)}catch(err){}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&playerEl&&!document.fullscreenElement)closePlayer()});

const AGE_NUM={all:0,"3":3,"7":7,"10":10,"12":12,"13":13,"15":15,"16":16,"17":17,"18":18};
// each answer: [key, minimum age, descriptors it adds]
const AGE_Q=[
  ["violence",[["none",0],["cartoon",7,["violence"]],["fantasy",10,["violence"]],["realistic",13,["violence"]],["injuries",16,["violence"]],["gore",18,["violence","blood"]]]],
  ["blood",[["none",0],["little",12,["blood"]],["lots",16,["blood"]],["extreme",18,["blood"]]]],
  ["fear",[["none",0],["mild",7,["fear"]],["scary",12,["fear"]],["horror",15,["fear"]],["intense",17,["fear"]]]],
  ["language",[["none",0],["mild",10,["language"]],["moderate",13,["language"]],["strong",16,["language"]],["slurs",18,["language","discrimination"]]]],
  ["sexual",[["none",0],["romance",7],["suggestive",13,["sexual"]],["explicit",18,["sexual"]]]],
  ["drugs",[["none",0],["mentioned",12,["drugs"]],["shown",16,["drugs"]],["used",18,["drugs"]]]],
  ["gambling",[["none",0],["chance",12,["gambling"]],["casino",18,["gambling"]]]],
  ["themes",[["none",0],["mature",15,["mature"]],["discrimination",16,["discrimination"]]]],
  ["online",[["no",0],["chat",0,["online"]]]],
  ["purchases",[["no",0],["yes",0,["purchases"]]]]];
function ageFromAnswers(ans){let max=0;const d=new Set();

  const r=AGES.find(a=>AGE_NUM[a]>=max)||"18";return{rating:max===0?"all":r,desc:[...d]}}

let myFollows=new Set();
async function studioPage(main,id,stale){
  if(!/^[0-9a-f-]{36}$/i.test(id||""))throw new Error(t("notfound"));
  const[sr,gr,csr,br,dsr]=await Promise.all([sb.from("studios").select("id,owner,name,downloads,followers,members,created_at,support_email,status,verify_status,about,logo_url,banner_url,website,discord_url,youtube_url,x_url").eq("id",id).maybeSingle(),
    live().eq("studio_id",id).order("created_at",{ascending:false}),
    sb.from("game_studios").select("game_id,role").eq("studio_id",id).eq("status","accepted"),
    sb.from("bundles").select("id,title,price,game_ids").eq("studio_id",id).eq("published",true),
    sb.from("devlogs").select(DEVLOG_COLS).eq("studio_id",id).order("created_at",{ascending:false}).limit(12)]);
  if(stale())return;const s=sr.data;
  if(!s){main.innerHTML=`<div class="empty"><b>${t("notfound")}</b></div>`;return}
  setTitle(s.name);
  const ownIds=(gr.data||[]).map(g=>g.id);
  const[colGames,gw]=await Promise.all([gamesByIds((csr.data||[]).map(c=>c.game_id)),
    ownIds.length?sb.from("awards").select("kind,period").in("game_id",ownIds).like("kind","goty%"):Promise.resolve({data:[]})]);
  if(stale())return;
  const gotyWins=[...new Set((gw.data||[]).map(a=>a.period))].sort().reverse();
  const mine=me&&me.id===s.owner,following=myFollows.has(s.id);
  const next=s.downloads>=500?null:s.downloads>=50?500:50;
  const logo=okUrl(s.logo_url||""),banner=okUrl(s.banner_url||"");
  const links=[["website","🌐",s.website],["Discord","💬",s.discord_url],["YouTube","▶",s.youtube_url],["X","𝕏",s.x_url]].filter(l=>okUrl(l[2]||""));
  main.innerHTML=`<div class="sbanner" style="${banner?`background:linear-gradient(0deg,#1b2838,#1b283800 70%),url('${esc(banner)}') center/cover`:`background:linear-gradient(120deg,hsl(${hash(s.name)%360} 45% 30%),#1b2838)`}"></div>
    <div class="prof sprof">${logo?`<span class="av" style="width:110px;height:110px"><img src="${esc(logo)}" alt=""></span>`:avatarHTML({username:s.name},110)}<div style="flex:1;min-width:0"><h1>${esc(s.name)} ${badgeHTML(s.downloads)}</h1>${gotyWins.length?`<div class="gotywin">🏆 ${t("gotyWinner")} ${gotyWins.join(" · ")}</div>`:""}
    <div class="mut">${(s.downloads||0).toLocaleString()} ${t("downloads")} · ${(s.followers||0).toLocaleString()} ${t("followersL")} · ${s.members} ${t("members")} · ${t("member")} ${fmtDate(s.created_at)}</div>
    ${s.verify_status==="verified"?`<div class="dim" style="font-size:12px">✔ ${t("verified")}</div>`:""}
    ${next?`<div class="dim" style="font-size:12px">${t("nextBadge").replace("{n}",next-s.downloads).replace("{b}",next===50?t("blueS"):t("goldS"))}</div>`:""}
    <div class="slinks">${links.map(([n,i,u])=>`<a class="btn ghost sm" href="${esc(okUrl(u))}" target="_blank" rel="noopener">${i} ${n==="website"?t("website"):n}</a>`).join("")}
      <a class="btn ghost sm" href="mailto:${esc(s.support_email)}">✉ ${t("support")}</a></div></div>
    <div style="display:flex;flex-direction:column;gap:6px">${mine?`<button class="btn" id="eds">✎ ${t("editStudio")}</button>`:`<button class="btn ${following?"ghost":"green"}" id="flw">${following?"✓ "+t("following"):"+ "+t("follow")}</button>`}
      <button class="btn ghost" id="shs">🔗 ${t("share")}</button></div></div>
    ${s.about?`<div class="about panel" style="margin-top:12px">${esc(s.about)}</div>`:""}
    <h2 class="sec">${t("gamesby")} ${esc(s.name)} <span class="mut">(${(gr.data||[]).length})</span></h2>
    ${(gr.data||[]).length?`<div class="grid">${gr.data.map(cardHTML).join("")}</div>`:`<div class="mut">—</div>`}
    ${colGames.length?`<h2 class="sec">🤝 ${t("colGames")}</h2><div class="grid">${colGames.map(cardHTML).join("")}</div>`:""}
    ${(br.data||[]).length?`<h2 class="sec">📦 ${t("bundles")}</h2><div class="grid">${br.data.map(bundleCardHTML).join("")}</div>`:""}
    ${(dsr.data||[]).length||mine?`<h2 class="sec">📝 ${t("devlogs")}${mine?`<a href="#" id="sdl">+ ${t("newDevlog")}</a>`:""}</h2>${(dsr.data||[]).length?`<div class="grid">${dsr.data.map(devlogCardHTML).join("")}</div>`:`<div class="mut">—</div>`}`:""}`;

function studioEditForm(s){
  const m=modal("✎ "+t("editStudio"),`<div class="form" style="max-width:none">
    <label>${t("sname")}<input class="inp" value="${esc(s.name)}" disabled><span class="hint">${t("nameLocked")}</span></label>
    <label>${t("aboutStudio")}<textarea class="inp" id="sa" maxlength="3000" style="min-height:110px">${esc(s.about||"")}</textarea></label>
    <div class="two"><label>${t("logo")} <span class="hint">(${t("square")})</span><input type="file" id="sl" accept="image/png,image/jpeg,image/webp,image/gif"></label>
      <label>${t("banner")} <span class="hint">(1600×400)</span><input type="file" id="sbn" accept="image/png,image/jpeg,image/webp,image/gif"></label></div>
    <div class="two"><label>${t("website")}<input class="inp" id="sw" dir="ltr" maxlength="300" placeholder="https://…" value="${esc(s.website||"")}"></label>
      <label>Discord<input class="inp" id="sd" dir="ltr" maxlength="300" placeholder="https://discord.gg/…" value="${esc(s.discord_url||"")}"></label></div>
    <div class="two"><label>YouTube<input class="inp" id="syt" dir="ltr" maxlength="300" placeholder="https://youtube.com/@…" value="${esc(s.youtube_url||"")}"></label>
      <label>X<input class="inp" id="sx" dir="ltr" maxlength="300" placeholder="https://x.com/…" value="${esc(s.x_url||"")}"></label></div>
    <div class="two"><label>${t("smembers")}<input class="inp" type="number" id="sm2" min="1" max="1000" value="${s.members}"></label>
      <label>${t("semail")}<input class="inp" id="se2" type="email" dir="ltr" value="${esc(s.support_email)}"></label></div>
    <div class="err" id="ste2"></div><div class="acts"><button class="btn ghost" data-x>${t("cancel")}</button><button class="btn green" id="sts2">${t("save")}</button></div></div>`,true);
  m.el.querySelector("#sts2").onclick=async e=>{const g=id=>m.el.querySelector(id),er=g("#ste2");er.textContent="";
    const urls={website:g("#sw").value.trim(),discord_url:g("#sd").value.trim(),youtube_url:g("#syt").value.trim(),x_url:g("#sx").value.trim()};
    for(const k in urls){if(urls[k]&&!okUrl(urls[k])){er.textContent=t("err_badurl");return}urls[k]=urls[k]||null}
    const rec={...urls,about:g("#sa").value.trim()||null,members:Math.max(1,Math.floor(+g("#sm2").value||1)),support_email:g("#se2").value.trim()};
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(rec.support_email)){er.textContent=t("err_required");return}
    e.target.disabled=true;e.target.textContent=t("uploading");
    try{const lf=g("#sl").files[0],bf=g("#sbn").files[0];
      if(lf)rec.logo_url=await upload(lf,"logo",IMG,3);if(bf)rec.banner_url=await upload(bf,"banner",IMG,5);
      const{error}=await sb.from("studios").update(rec).eq("id",s.id);if(error)throw error;
      const old=[lf&&s.logo_url,bf&&s.banner_url].map(storagePath).filter(Boolean);if(old.length)sb.storage.from("media").remove(old).catch(()=>{});
      m.close();toast(t("saved"));route()}
    catch(ex){er.textContent=errMsg(ex);e.target.disabled=false;e.target.textContent=t("save")}};
}

<h2>4. שירותים שאנחנו משתמשים בהם</h2><ul>

<li><b>בדיקת תוכן אוטומטית</b> רצה בשרת שלנו עם בודק פנימי (כללים ומודל AI קטן מובנה). השם, התיאורים, התגיות וקוד ה-HTML של משחקים שהוגשו נבדקים שם לבעיות זכויות יוצרים, תוכן לא בטוח, הונאות וקוד זדוני. <b>שום דבר לא נשלח לשירות AI חיצוני.</b></li>

<p>השירותים האלה מעבדים מידע לפי מדיניות הפרטיות שלהם. אנחנו משתפים מידע עם רשויות רק כשהחוק מחייב, או כדי להגן על משתמשים מפגיעה חמורה.</p>
<h2>5. ילדים</h2><p>חשבונות וסטודיואים הם מגיל 13 ומעלה; אנחנו שואלים את הגיל בהרשמה ושומרים רק קבוצת גיל (13–15, 16–17 או 18+). אם אתה מתחת לגיל 18 (או מתחת לגיל הבגרות במדינה שלך), מותר להשתמש בחנות רק באישור הורה או אפוטרופוס, שמסכים למדיניות בשבילך. מפתחים מתחת לגיל 16 צריכים אישור של הורה: אנחנו שולחים להורה מייל אחד עם קישור לאישור, וכתובת המייל של ההורה נמחקת תוך 14 יום. הורה יכול לבקש לראות או למחוק את המידע של הילד בכל זמן.</p>
<h2>6. הזכויות שלך</h2><p>אפשר לערוך את הפרופיל והסטודיו, למחוק ביקורות, משחקים והתראות, להתנתק, ו<b>למחוק את כל החשבון בהגדרות</b> בכל זמן. אפשר לבקש במייל לראות, לתקן, לייצא או למחוק את המידע שלך; נענה תוך 30 יום. חלק מהרשומות (למשל קבלות או תיעוד של הפרת כללים) עשויות להישמר כל עוד צריך מסיבות אבטחה או מסיבות חוקיות.</p>
<h2>7. אבטחה ושמירת מידע</h2><p>הגישה למידע מוגנת בכללים בשרת, קבצים פרטיים נשמרים באחסון פרטי, וכל קובץ שמועלה נסרק לתוכנות זדוניות. אף מערכת לא מאובטחת ב-100%, אז כדאי להשתמש בסיסמה חזקה וייחודית. מידע החשבון נשמר כל עוד החשבון קיים; מידע האימות עד 3 ימים אחרי החלטת הבדיקה; תוכן שנמחק יורד מהחנות מיד, ומהגיבויים עם הזמן.</p>
<h2>8. שינויים</h2><p>אם המדיניות משתנה, נעדכן את התאריך למעלה ונודיע בחנות על שינויים חשובים.</p>`,
terms:`<h1>תנאי שימוש</h1><p class="dim">עודכן לאחרונה: ${LEGAL_UPDATED}</p>
<p>התנאים האלה הם הסכם בינך לבין Man Studio Store ("אנחנו", "החנות"). כשפותחים חשבון, מורידים או משחקים במשחק, או מפרסמים תוכן, מסכימים לתנאים האלה ול<a href="#/privacy">מדיניות הפרטיות</a>. אם אתה לא מסכים, אל תשתמש בחנות.</p>
<h2>1. מי יכול להשתמש בחנות</h2><p>צריך להיות <b>לפחות בן 13</b> כדי לפתוח חשבון. אם אתה מתחת לגיל 18 (או מתחת לגיל הבגרות במדינה שלך), הורה או אפוטרופוס צריך להסכים לתנאים בשבילך, והוא אחראי לשימוש שלך בחנות. אפשר לפתוח סטודיו מגיל 13; מפתחים מתחת לגיל 16 צריכים אישור של הורה, שההורה נותן בלחיצה על קישור שאנחנו שולחים לו במייל. ילדים מתחת לגיל 13 יכולים לגלוש בחנות בלי חשבון.</p>
<h2>2. חשבונות</h2><p>שמור על הסיסמה ועל פרטים נכונים. אתה אחראי למה שקורה בחשבון שלך. אסור לאדם אחד להשתמש בכמה חשבונות כדי לרמות (למשל לצבור Coins, ביקורות או הצבעות). אנחנו רשאים להשעות או לסגור חשבונות שמפרים את התנאים. אפשר למחוק את החשבון בכל זמן בהגדרות. שמות משתמש, שמות סטודיו, תיאורים, ביקורות ודבלוגים נבדקים אוטומטית, וטקסט עם תוכן למבוגרים, שנאה, בריונות, הונאה או התחזות נחסם.</p>
<h2>3. Coins</h2><p>Coins הם קרדיט וירטואלי לחנות. <b>אין להם ערך כספי</b>, אי אפשר לקנות, למכור, להחליף, להעביר או למשוך אותם בכסף אמיתי, והם לא רכוש. חשבון חדש מתחיל עם 500 Coins ומקבל 10 Coins בפעם הראשונה שכל משחק נכנס לספרייה. אנחנו רשאים לשנות פרסים ומחירים ב-Coins ולתקן יתרות שהתקבלו בטעות, בגלל באג או משימוש לרעה. רכישות ב-Coins סופיות; משחק שקנית נשאר שלך ולא משלמים עליו שוב.</p>
<h2>4. החנות היא פלטפורמה</h2><p>המשחקים, הדמואים, הדבלוגים ודפי הסטודיו נוצרים על ידי <b>מפתחים עצמאיים</b>, לא על ידינו. כל מפתח אחראי לבדו לתוכן שלו. זה שבדקנו משחק, סרקנו אותו, נתנו לו פרס או קידמנו אותו לא אומר שאנחנו ממליצים עליו, מבטיחים אותו או אחראים לו. אתה מקבל זכות אישית שאי אפשר להעביר לשחק במשחקים שבספרייה שלך; היא לא נותנת לך בעלות על המשחק.</p>
<h2>5. הורדות ואבטחה</h2><p>כל קובץ משחק שמועלה נסרק אוטומטית לתוכנות זדוניות (עם VirusTotal ועם בדיקות שלנו) ונבדק על ידי אדם, ומשחקי Windows חייבים לכלול את קוד המקור. ובכל זאת, <b>אף סריקה ואף בדיקה לא יכולות להבטיח שקובץ בטוח לגמרי</b>. משחקים שמורידים (EXE/ZIP) רצים על המחשב שלך <b>באחריותך</b>: כדאי להשתמש באנטי-וירוס מעודכן ולגבות קבצים חשובים. אם משהו נראה חשוד, דווח מיד מדף המשחק; אנחנו רשאים להוריד משחק בכל זמן כדי להגן על השחקנים.</p>
<h2>6. כללים למפתחים</h2><ul>
<li>חייבות להיות לך הזכויות או הרשות לכל מה שאתה מעלה: קוד, גרפיקה, מוזיקה, צלילים, גופנים, שמות, לוגואים וסימני מסחר.</li>
<li><b>אסור:</b> וירוסים ותוכנות זדוניות, כורים, רוגלות, כל דבר שפוגע במכשירים או גונב מידע; משחקים גנובים או מועתקים; תוכן לא חוקי, שנאה, מיני או אלים מאוד; הונאות ופישינג; איסוף מידע על אנשים בלי רשות.</li>
<li>משחקי Windows (EXE/ZIP) חייבים לכלול קובץ .zip של קוד המקור. הוא נשמר באחסון פרטי, רק אתה ומנהלי החנות רואים אותו, הוא משמש רק לבדוק שהמשחק בטוח ואמיתי, והוא אף פעם לא משותף עם שחקנים ולא נשלח לשירותים חיצוניים.</li>
<li>כל משחק נבדק אוטומטית על ידי בודק תוכן AI (זכויות יוצרים, תוכן לא בטוח, הונאות וקוד זדוני) ואחר כך על ידי אדם. ה-AI יכול לדחות משחק אוטומטית כשהוא מוצא בעיה ברורה וחמורה; הוא אף פעם לא מאשר משחק לבד. אפשר לתקן ולשלוח שוב, או לערער במייל.</li>
<li>כל סטודיו ומשחק נבדקים לפני פרסום, וכל פעם שהקבצים משתנים הם נסרקים מחדש. הבדיקות בימים ראשון–שישי (שבת וחלק מהחגים סגורים). אנחנו רשאים לדחות, להסתיר או להוריד תוכן שמפר את הכללים; קבצים שזוהו כמסוכנים נדחים ונמחקים אוטומטית.</li>
<li>אם נדחית, יש 30 יום לתקן ולשלוח שוב. עירעורים: <a href="mailto:${APPEAL_EMAIL}">${APPEAL_EMAIL}</a>.</li>
<li>כל הזכויות על המשחק נשארות שלך. אתה נותן לחנות רישיון חינמי, עולמי ולא בלעדי לאחסן, לסרוק, להציג, להפיץ ולקדם אותו (כולל צילומי מסך וטריילרים) כל עוד הוא בחנות, ולזמן סביר אחרי שהוא יורד, לגיבויים ולתיעוד.</li>
<li>אתה מתחייב שהתוכן שלך עומד בכללים ובחוק, ומסכים <b>לקחת אחריות ולשאת בהוצאות של כל תביעה שתוגש נגד החנות בגלל התוכן שלך</b> (למשל תביעת זכויות יוצרים או נזק שנגרם מקובץ שלך).</li>
<li>חלוקת הכנסות ב-Coins: עד 50 Coins — 80% לך; 50–200 — 75%; 200–500 — 70%; מעל 500 — 50%. קידום עולה 500 Coins ל-7 ימים. חבילות: רק משחקים שלך, במחיר מעל 25 Coins.</li></ul>

LEGAL.en.access=`<h1>Accessibility Statement</h1><p class="dim">Last updated: ${LEGAL_UPDATED}</p>
<p>Man Studio Store wants everyone — including people with disabilities — to be able to use the store. We work to meet the Israeli Standard IS 5568 (based on WCAG 2.0, level AA) as far as we can, and we keep improving.</p>
<h2>What we did</h2><ul>
<li>Full keyboard navigation with a clearly visible focus frame, and a "Skip to content" link at the top of every page.</li>
<li>A text size setting (Settings → Text size, up to 150%).</li>
<li>Improved color contrast for text.</li>
<li>Text descriptions (alt text) for game covers and images, and labels for buttons and fields for screen readers.</li>
<li>Animations are turned off when your device asks for reduced motion.</li>
<li>Popups close with the Esc key.</li>

function storagePath(url){const m=String(url||"").match(/\/storage\/v1\/object\/public\/media\/(.+)$/);return m?decodeURIComponent(m[1]):null}
async function upload(file,kind,types,maxMB){
  const ext=(file.name.split(".").pop()||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  let type=file.type;if(!type&&(ext==="html"||ext==="htm"))type="text/html";
  if(ext==="exe")type="application/octet-stream";else if(ext==="zip")type="application/zip";
  if(!types.includes(type))throw new Error(t("err_type")+": "+file.name);
  if(file.size>maxMB*1048576)throw new Error(t("err_big")+` (${maxMB}MB): `+file.name);
  const path=`${me.id}/${kind}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext||"bin"}`;
  const{error}=await sb.storage.from("media").upload(path,file,{contentType:type,cacheControl:"31536000",upsert:false});
  if(error)throw error;
  return sb.storage.from("media").getPublicUrl(path).data.publicUrl;
}

  const pk=()=>document.querySelector("input[name=pk]:checked").value;

  const syncPrice=()=>{const p=Math.max(0,Math.floor(+$("#fpr").value||0));$("#fprh").textContent=p?t("f_pricehint").replace("{p}",Math.round(devShare(p)*100)).replace("{c}",Math.floor(p*devShare(p))):t("free")};
  syncPrice();$("#fpr").oninput=syncPrice;
  const relDate=()=>{const p=$("#frp").value;if(p==="tba")return null;if(p==="day")return $("#frd").value||null;if(p==="month")return $("#frm").value?$("#frm").value+"-01":null;
    const y=Math.floor(+$("#fry").value);if(!(y>=2000&&y<=2100))return null;if(p==="year")return y+"-01-01";return y+"-"+String((+$("#frq").value-1)*3+1).padStart(2,"0")+"-01"};
  const syncPrec=()=>{const p=$("#frp").value;$("#frdD").hidden=p!=="day";$("#frdM").hidden=p!=="month";$("#frdQ").hidden=!(p==="quarter"||p==="year");$("#frqw").hidden=p!=="quarter"};
  syncPrec();$("#frp").onchange=syncPrec;
  const syncSoon=()=>{const s=$("#fsoon").checked;$("#frdw").hidden=!s;$("#freq").textContent=s?t("f_later"):"*"};syncSoon();
  $("#fsoon").onchange=syncSoon;
  let newShots=[];

    if(exeFile&&kind==="download"){if(!/\.(exe|zip)$/i.test(exeFile.name)){err.textContent=t("err_type");return}

    if(kind==="link"&&!/^https?:\/\//i.test(link)&&!(soon&&!link)){err.textContent=t("err_badurl");return}
    const srcFile=$("#fsrc").files[0],hasBuild=(kind==="download"&&(exeFile||g.play_url))||((document.querySelector("input[name=dk]:checked")||{}).value==="download");
    if(hasBuild&&!srcFile&&!g.source_name){err.textContent=t("srcNeed");$("#srcBox").scrollIntoView({behavior:"smooth",block:"center"});return}
    if(srcFile&&!/\.zip$/i.test(srcFile.name)){err.textContent=t("srcZip");return}
    const yt=$("#fy").value.trim();if(yt&&!ytId(yt)){err.textContent=t("err_badurl")+" (YouTube)";return}
    if((!id||rejectedOpen)&&checklist().some(([,ok])=>!ok)){err.textContent=t("clFail");$("#clBox").scrollIntoView({behavior:"smooth",block:"center"});return}
    btn.disabled=true;btn.textContent=t("uploading");
    try{
      const rec={title,short_desc:short,description:$("#fdesc").value.trim(),genre:$("#fg").value,
        tags:[...new Set($("#ftags").value.split(/[,،]/).map(s=>s.trim()).filter(Boolean))].slice(0,12).map(s=>s.slice(0,30)),
        trailer_url:yt||null,min_reqs:$("#fr").value.trim()||null,published:$("#fp").checked,play_kind:kind,
        coming_soon:soon,release_date:soon?relDate():(g.release_date||null),release_precision:soon?$("#frp").value:(g.release_precision||"day"),
        price:Math.max(0,Math.min(100000,Math.floor(+$("#fpr").value||0))),version:$("#fver").value.trim()||null,
        ...ageVals(),release_as:$("#frel").value,auto_release:$("#fauto").checked,ea_note:$("#fea").value.trim()||null,...($("#facc")?{access_type:$("#facc").value}:{}),
        copyright_holder:$("#fcop").value.trim()||null,license:$("#flic").value,translations:readTranslations()};
      Object.assign(rec,await readDemo(g));
      const cf=$("#fc").files[0];if(cf)rec.cover_url=await upload(cf,"cover",IMG,5);
      const up=[];for(const f of newShots)up.push(await upload(f,"shot",IMG,5));rec.screenshots=[...shots,...up].slice(0,8);
      rec.file_name=null;rec.file_size=null;
      let oldSrc=null;if(srcFile){if(id){const o=await sb.rpc("game_source",{p_game:id});oldSrc=o.data||null}
        rec.source_path=await uploadSource(srcFile);rec.source_name=srcFile.name.slice(0,200);rec.source_size=srcFile.size}
      if(kind==="html"){rec.play_url=htmlFile?await upload(htmlFile,"game",["text/html"],50):g.play_url;if(htmlFile)rec.file_hash=await sha256(htmlFile)}
      else if(kind==="download"){
        if(exeFile){rec.play_url=await upload(exeFile,"build",["application/octet-stream","application/zip"],50);rec.file_name=exeFile.name.slice(0,200);rec.file_size=exeFile.size;rec.file_hash=await sha256(exeFile)}
        else{rec.play_url=g.play_url;rec.file_name=g.file_name;rec.file_size=g.file_size}}
      else{rec.file_hash=null;rec.play_url=okUrl(link)||null;try{rec.file_name=rec.play_url?new URL(rec.play_url).hostname.replace(/^www\./,""):null}catch(e){rec.file_name=null}}
      let res;
      if(rejectedOpen)rec.review_status="pending";
      if(id)res=await sb.from("games").update(rec).eq("id",id).select("id").single();
      else res=await sb.from("games").insert({...rec,owner:me.id,studio_id:studio.id}).select("id").single();
      if(res.error)throw res.error;
      // remove replaced files
      const old=[];if(id){if(cf&&g.cover_url)old.push(g.cover_url);if(g.play_kind!=="link"&&g.play_url&&g.play_url!==rec.play_url)old.push(g.play_url);
        for(const s of g.screenshots||[])if(!rec.screenshots.includes(s))old.push(s)}
      const op=old.map(storagePath).filter(Boolean);if(op.length)sb.storage.from("media").remove(op).catch(()=>{});
      if(oldSrc&&oldSrc!==rec.source_path)sb.storage.from("sources").remove([oldSrc]).catch(()=>{});
      sb.functions.invoke("scan-games",{body:{}}).catch(()=>{});sb.functions.invoke("ai-review",{body:{}}).catch(()=>{});
      toast(id&&!rejectedOpen?t("saved"):t("published"));location.hash=id?"#/app/"+res.data.id:"#/dashboard";
    }catch(ex){console.error(ex);err.textContent=errMsg(ex);btn.disabled=false;btn.textContent=rejectedOpen?t("resubmitBtn"):id?t("f_saveedit"):t("f_save")}
  };
}

function chartSVG(rows,key,color){
  const max=Math.max(1,...rows.map(r=>+r[key])),w=600,h=120,bw=w/rows.length;
  return `<svg viewBox="0 0 ${w} ${h+18}" class="chart" role="img" aria-label="${key}">${rows.map((r,i)=>{const v=+r[key],bh=Math.round(v/max*h);
    return `<rect x="${i*bw+1}" y="${h-bh}" width="${Math.max(1,bw-2)}" height="${bh}" rx="2" fill="${color}"><title>${r.day}: ${v}</title></rect>`}).join("")}
    <text x="0" y="${h+14}" fill="#8f98a0" font-size="11">${rows[0]?.day||""}</text><text x="${w}" y="${h+14}" fill="#8f98a0" font-size="11" text-anchor="end">${rows.at(-1)?.day||""}</text></svg>`}

/* ============ review helpers ============ */
function ilNow(){return new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Jerusalem"}))}
const isShabbat=()=>ilNow().getDay()===6;
let HOLIDAYS=new Map();
const dayKey=d=>new Date(d).toLocaleDateString("en-CA",{timeZone:"Asia/Jerusalem"});
async function loadHolidays(){const from=new Date(Date.now()-40*864e5).toISOString().slice(0,10);
  const{data}=await sb.from("store_holidays").select("day,kind,name_en,name_he").gte("day",from).order("day");HOLIDAYS=new Map((data||[]).map(h=>[h.day,h]))}
const hname=h=>lang==="he"?h.name_he:h.name_en;
const holidayToday=()=>HOLIDAYS.get(dayKey(new Date()));
const closedToday=()=>{const h=holidayToday();return h&&h.kind==="closed"?h:null};
function reviewBanner(){const h=holidayToday();
  if(h&&h.kind==="closed")return `<div class="banner">🔒 ${esc(hname(h))} — ${t("holClosedB")} <a href="#/holidays">${t("holT")}</a></div>`;
  if(isShabbat())return `<div class="banner">${t("shabbat")}</div>`;
  if(h)return `<div class="banner" style="background:#2a3f5a;color:#c6d4df">⏸️ ${esc(hname(h))} — ${t("holNoCountB")} <a href="#/holidays">${t("holT")}</a></div>`;return ""}
function addBiz(date,n){const d=new Date(date);let k=0;while(k<n){d.setDate(d.getDate()+1);if(d.getDay()!==6&&!HOLIDAYS.has(dayKey(d)))k++}return d}
function etaHTML(from,a,b){return `<div class="mut">${t("reviewTime").replace("{a}",a).replace("{b}",b)} · ${t("expected").replace("{d}",fmtDate(addBiz(from,b)))}</div>`}
function fixLine(deadline){
  if(deadline&&new Date(deadline)>new Date())return `<span>${t("fixBy").replace("{d}",fmtDate(deadline))}</span>`;
  return `<span>${t("fixClosed")} <a href="mailto:${APPEAL_EMAIL}" dir="ltr">${APPEAL_EMAIL}</a></span>`;
}
function errMsg(e){const m=(e&&e.message)||"";
  for(const c of["TERMS_REQUIRED","TOO_YOUNG_13","CONTENT_BLOCKED","PARENT_NOT_CONFIRMED","BAD_LINK","CONFIRM_MISMATCH","ADMIN_CANT_DELETE","SHABBAT_CLOSED","HOLIDAY_CLOSED","SOURCE_REQUIRED","BAD_SOURCE","SCAN_PENDING","SCAN_MALICIOUS","AI_PENDING","AI_REJECTED","FIX_WINDOW_CLOSED","STUDIO_NOT_VERIFIED","REASON_REQUIRED","ALREADY_SUBMITTED","NOT_ENOUGH_COINS","BAD_CARD","ALREADY_OWNED",
    "OWN_GAME","NOT_OWNED","NOT_AVAILABLE","WAIT_7_DAYS","NO_GAME_FILE","VERIFY_FIRST","FESTIVAL_FULL","AGREEMENT_REQUIRED","BIRTH_DATE_REQUIRED","TOO_YOUNG","PARENT_CONSENT_REQUIRED","PLAY_10_MIN","ALREADY_CLAIMED","BAD_KEY","KEY_USED","BUNDLE_SAME_STUDIO","NO_USER","NOT_YOUR_GAME"])if(m.includes(c))return t("e_"+c);
  if(/bundles_price_check/.test(m))return t("bundleRule");
  if(/games_sale_window|sale_pct_check/.test(m))return t("saleHint");
  if(/studios_name_lower|duplicate key.*studios/i.test(m))return t("e_name_taken");
  return m||t("err_generic")}
function reviewPill(g){
  if(g.review_status==="approved")return `<span class="pill">${t("g_approved")}</span>${g.lucky?` <span class="pill luck">${t("lucky")}</span>`:""}`;

/* ============ auth ============ */
function authView(main,q){
  setTitle(t("login"));const next=q.get("next")||"#/";
  if(me){location.hash=next;return}
  let mode="in";
  const draw=()=>{main.innerHTML=`<div class="auth"><div class="tabsb"><button class="${mode==="in"?"on":""}" data-m="in">${t("login")}</button><button class="${mode==="up"?"on":""}" data-m="up">${t("signup")}</button></div>
    <form class="panel" id="af">
      ${mode==="up"?`<label class="form" style="gap:5px">${t("username")}<input class="inp" id="au" maxlength="32" autocomplete="username" required></label>`:""}
      <label class="form" style="gap:5px">${mode==="in"?t("loginField"):t("email")}<input class="inp" id="ae" type="${mode==="in"?"text":"email"}" autocomplete="${mode==="in"?"username":"email"}" dir="ltr" required></label>
      ${mode==="up"?`<label class="form" style="gap:5px">${t("yourAge")} *<input class="inp" id="aage" type="number" min="1" max="120" required style="max-width:120px"><span class="hint">${t("ageHint13")}</span></label>`:""}
      ${mode==="up"?`<label style="display:flex;gap:8px;align-items:flex-start;font-size:13px"><input type="checkbox" id="agr" style="margin-top:3px"><span>${t("agree").replace("{t}",`<a href="#/terms" target="_blank">${t("termsT")}</a>`).replace("{p}",`<a href="#/privacy" target="_blank">${t("privacyT")}</a>`)}</span></label>`:""}
      ${mode!=="forgot"?`<label class="form" style="gap:5px">${t("password")}<input class="inp" id="ap" type="password" minlength="6" autocomplete="${mode==="up"?"new-password":"current-password"}" dir="ltr" required></label>`:""}
      <div class="err" id="aerr"></div>
      <button class="btn green" id="ago">${mode==="in"?t("login"):mode==="up"?t("signup"):t("sendreset")}</button>
      ${mode==="in"?`<a href="#" id="fg" class="mut" style="font-size:12px">${t("forgot")}</a>`:""}
    </form></div>`;
    main.querySelector(".tabsb").onclick=e=>{if(e.target.dataset.m){mode=e.target.dataset.m;draw()}};
    if($("#fg"))$("#fg").onclick=e=>{e.preventDefault();mode="forgot";draw()};
    $("#af").onsubmit=async e=>{e.preventDefault();const er=$("#aerr"),b=$("#ago");er.textContent="";er.style.color="";b.disabled=true;
      const email=$("#ae").value.trim(),pw=$("#ap")?.value||"";
      try{
        if(mode==="in"){
          if(email.includes("@")){const{error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error}
          else{ // username login: a server function finds the account without revealing anyone's email
            const r=await fetch(SB_URL+"/functions/v1/login",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify({login:email,password:pw})});
            const j=await r.json().catch(()=>({error:t("err_generic")}));if(!r.ok||j.error)throw new Error(j.error||t("err_generic"));
            const{error}=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(error)throw error}
          toast(t("welcome"));location.hash=next}
        else if(mode==="up"){const u=$("#au").value.trim();if(u.length<2)throw new Error(t("err_required"));const age=Math.floor(+$("#aage").value);if(!age)throw new Error(t("yourAge")+" — "+t("err_required"));if(age<13)throw new Error(t("e_TOO_YOUNG_13"));
          if(!$("#agr").checked)throw new Error(t("mustAgree"));
          const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{username:u,age:String(age),terms_version:TERMS_VERSION},emailRedirectTo:location.href.split("#")[0]}});
          if(error)throw new Error(/database error/i.test(error.message)?t("signupBlocked"):error.message);
          if(data.session){toast(t("welcome"));location.hash=next}else{er.style.color="#a4d007";er.textContent=t("checkmail");mode="in"}}
        else{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href.split("#")[0]});if(error)throw error;er.style.color="#a4d007";er.textContent=t("resetSent")}
      }catch(ex){er.textContent=ex.message}b.disabled=false};
  };draw();
}

    <div class="panel"><h3>${t("account")}</h3>
      ${me?`<div class="mut">${t("signedAs")} <b style="color:#fff">${esc(me.profile.username)}</b> · <span dir="ltr">${esc(me.email||"")}</span></div>
        <form class="form" id="cp" style="margin-top:12px"><label>${t("changepass")}<input class="inp" id="cpn" type="password" minlength="6" autocomplete="new-password" dir="ltr" placeholder="${t("newpass")}" required></label>
        <div class="err" id="cpe"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn">${t("savepass")}</button>
        <a class="btn ghost" href="#/user/${encodeURIComponent(me.profile.username)}">${t("editprof")}</a>
        <button type="button" class="btn red" id="slo">${t("logout")}</button></div></form>
        ${me.profile.is_admin?"":`<div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px"><b style="color:#ff8a80">🗑️ ${t("delAccT")}</b><div class="mut" style="font-size:13px">${t("delAccS")}</div>
          <button type="button" class="btn red sm" id="delAcc" style="margin-top:8px">${t("delAccT")}</button></div>`}`
      :`<div class="mut">${t("notSigned")}</div><a class="btn green" style="margin-top:10px" href="#/login?next=%23%2Fsettings">${t("login")}</a>`}
    </div></div>`;
  $("#clang").onchange=e=>{lsSet("pp_clang",e.target.value);toast("🌐 "+t("saved"))};
  $("#tzoom").onchange=e=>{lsSet("pp_zoom",e.target.value);document.body.style.zoom=e.target.value};
  $("#agemax").onchange=e=>{e.target.value?lsSet("pp_agemax",e.target.value):(()=>{try{localStorage.removeItem("pp_agemax")}catch(x){}})();toast("🔞 "+t("saved"))};
  $("#langs").onclick=e=>{const b=e.target.closest("button");if(b&&b.dataset.l!==lang)setLang(b.dataset.l)};
  if(me){
    $("#cp").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.updateUser({password:$("#cpn").value});
      if(error){$("#cpe").textContent=error.message;return}$("#cpn").value="";toast(t("passSaved"))};
    $("#slo").onclick=async()=>{await sb.auth.signOut();location.hash="#/"};
    if($("#delAcc"))$("#delAcc").onclick=()=>{const m=modal("🗑️ "+t("delAccT"),`<div class="mut">${t("delAccS")}</div><div class="status bad" style="margin-top:8px">${t("delAccWarn")}</div>
      <label class="form" style="gap:5px;max-width:none;margin-top:10px">${t("delAccType").replace("{u}",`<b>${esc(me.profile.username)}</b>`)}<input class="inp" id="daU" autocomplete="off"></label>
      <div class="err" id="daE"></div><div class="acts"><button class="btn ghost" data-x>${t("cancel")}</button><button class="btn red" id="daGo">${t("delAccT")}</button></div>`);
      m.el.querySelector("#daGo").onclick=async e=>{const er=m.el.querySelector("#daE");er.textContent="";const v=m.el.querySelector("#daU").value.trim();
        if(v.toLowerCase()!==me.profile.username.toLowerCase()){er.textContent=t("e_CONFIRM_MISMATCH");return}
        e.target.disabled=true;try{const{data:ss}=await sb.auth.getSession();
          const r=await fetch(SB_URL+"/functions/v1/delete-account",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+ss.session.access_token},body:JSON.stringify({confirm:v})});
          const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(t("e_"+(j.error||""))!=="e_"+(j.error||"")?t("e_"+j.error):(j.error||t("err_generic")));
          await sb.auth.signOut();m.close();location.hash="#/";toast("🗑️ "+t("delAccDone"))}catch(ex){er.textContent=ex.message;e.target.disabled=false}}};
  }
}
function resetView(main){
  setTitle(t("newpass"));
  main.innerHTML=`<div class="auth"><form class="panel" id="rf" style="border-radius:4px"><label class="form" style="gap:5px">${t("newpass")}<input class="inp" id="np" type="password" minlength="6" autocomplete="new-password" dir="ltr" required></label>
    <div class="err" id="rerr"></div><button class="btn green">${t("savepass")}</button></form></div>`;
  $("#rf").onsubmit=async e=>{e.preventDefault();const{error}=await sb.auth.updateUser({password:$("#np").value});if(error){$("#rerr").textContent=error.message;return}toast(t("passSaved"));location.hash="#/"};
}

/* ============ boot ============ */
document.documentElement.lang=lang;document.documentElement.dir=lang==="he"?"rtl":"ltr";
let booted=false;
sb.auth.onAuthStateChange((ev,session)=>{
  setTimeout(async()=>{
    if(ev==="TOKEN_REFRESHED")return;
    const prev=me&&me.id;await loadMe(session);
    if(ev==="PASSWORD_RECOVERY"){location.hash="#/reset";return}
    if(!booted){booted=true;await Promise.all([loadHolidays().catch(()=>{}),loadSettings().catch(()=>{})]);route();if(!document.body.classList.contains("maint"))newsPopup();checkProgress();return}
    if((me&&me.id)!==prev)route();else renderHeader();
  },0);
});
window.addEventListener("hashchange",()=>{if(booted)route()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;const ovs=[...document.querySelectorAll(".ov")];const o=ovs[ovs.length-1];if(o&&o.querySelector("[data-x]"))o.remove()});
(()=>{const z=lsGet("pp_zoom");if(z)document.body.style.zoom=z})();
</script>
</body>
</html>
